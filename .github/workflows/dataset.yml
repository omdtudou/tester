# Collects data for the research spreadsheet. Run by hand. Read-only: public data, no trading.
# Each run continues from what is already saved.
name: dataset

on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Stop fetching Kalshi prices after this many minutes"
        default: "70"

permissions:
  contents: write

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the vlr.gg client
        run: pip install -q vlrdevapi
      - name: Valorant per-map scores (refetches older cache entries)
        run: python veto_backtest.py --collect --budget-minutes 25 --vlr-rps 3
      - name: Kalshi prices for CS2, LoL and Dota 2
        env:
          BUDGET: ${{ inputs.budget_minutes }}
        run: python tools/collect_dataset.py --budget-minutes "${BUDGET:-70}"
      - name: Save
        if: always()
        run: |
          git config user.name "arbscan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dataset data/backtest
          git commit -q -m "dataset $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
